Notes: "CoE and FoE. One RxPDO and one TxPDO (0x1c12/0x1c13 hold a single entry each, 0x1600/0x1a00); as shipped they carry 12 and 14 entries, fuller than other vendors because Mitsubishi maps its own 0x2d01..0x2d03 Control DI, 0x2d11..0x2d13 Status DO and 0x2d20 velocity limit alongside the standard objects. SDO-Info works and returns 809 objects. No ESI available to us, so DC is not preset."
