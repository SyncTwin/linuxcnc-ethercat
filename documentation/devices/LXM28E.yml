Notes: "CoE and FoE, but SDO-Info is NOT supported: the object dictionary reads back empty, so a master cannot enumerate it. 0x6502 reads 0x000000ed - pp, pv, tq, hm, ip and csp, with NO csv and NO cst, unlike the three other vendors on our bench which all answer 0x000003ad. One RxPDO and one TxPDO (0x1600/0x1a00) carrying 5 and 6 entries as shipped, pure CiA 402 with no vendor objects. DC system time transmission delay 1140 ns; no ESI available, so DC is not preset."
